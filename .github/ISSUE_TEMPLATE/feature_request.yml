name: Feature request
description: Propose a new rule, output format, or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository-quality issue can DevKit not currently detect or report?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should DevKit do? If proposing a new rule, remember it must be deterministic — no LLM or network calls.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, including existing rules/tools that come close.
